<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14100f" />
<title>Split Card — pace, distance &amp; time</title>
<meta name="description" content="Turn your coach's minute-based session into an estimated distance, pace, or time." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='38' fill='none' stroke='%23ff5a2b' stroke-width='8'/%3E%3Cline x1='50' y1='55' x2='50' y2='30' stroke='%23ff5a2b' stroke-width='7' stroke-linecap='round'/%3E%3Cline x1='50' y1='55' x2='68' y2='60' stroke='%23ff5a2b' stroke-width='7' stroke-linecap='round'/%3E%3Crect x='40' y='6' width='20' height='10' rx='3' fill='%23ff5a2b'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="track-lines" aria-hidden="true"></div>

<div class="app">

  <header class="app-header">
    <p class="eyebrow">Coach gives minutes. You want distance.</p>
    <h1>Split Card</h1>
  </header>

  <nav class="mode-tabs" role="tablist" aria-label="Calculation mode">
    <button type="button" class="tab active" role="tab" aria-selected="true" data-mode="distance">
      <span class="tab-line1">Time + Pace</span>
      <span class="tab-line2">→ Distance</span>
    </button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-mode="pace">
      <span class="tab-line1">Time + Distance</span>
      <span class="tab-line2">→ Pace</span>
    </button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-mode="time">
      <span class="tab-line1">Distance + Pace</span>
      <span class="tab-line2">→ Time</span>
    </button>
  </nav>

  <main class="card">

    <div class="field" data-field="time">
      <label for="time-input">Session time <span class="hint">minutes, like your coach writes it</span></label>
      <div class="input-row">
        <input id="time-input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="45" autocomplete="off" />
        <span class="unit-static">min</span>
      </div>
    </div>

    <div class="field" data-field="pace">
      <label for="pace-input">Pace</label>
      <div class="input-row">
        <input id="pace-input" type="text" inputmode="numeric" placeholder="5:30" autocomplete="off" />
        <div class="unit-toggle" data-toggle-target="pace-unit">
          <button type="button" class="active" data-value="km">/km</button>
          <button type="button" data-value="mi">/mi</button>
        </div>
      </div>
      <div class="chip-row" id="pace-chip-row" hidden>
        <div class="chips" id="pace-chips"></div>
        <button type="button" id="save-pace-btn" class="save-chip-btn" hidden>+ Save this pace</button>
      </div>
    </div>

    <div class="field" data-field="distance">
      <label for="distance-input">Distance</label>
      <div class="input-row">
        <input id="distance-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="8.2" autocomplete="off" />
        <div class="unit-toggle" data-toggle-target="distance-unit">
          <button type="button" class="active" data-value="km">km</button>
          <button type="button" data-value="mi">mi</button>
        </div>
      </div>
    </div>

    <div class="result">
      <span class="result-label" id="result-label">Estimated distance</span>
      <span class="result-value" id="result-value">—</span>
      <span class="result-sub" id="result-sub">&nbsp;</span>
    </div>

  </main>

  <footer class="app-footer">
    <p>Estimates assume even effort for the whole session — warm-up and cooldown will run a little slower.</p>
  </footer>

</div>

<script src="js/app.js"></script>
</body>
</html>
